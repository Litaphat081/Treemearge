<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Silver Birch — Jardin du Temps</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

  <style>


  .oak-layout   { min-height: 100vh; }
  .scroll-space { display: none; }
  .age-control  { display: none; }
  .stage-dots   { display: none; }

  /* Viewer fills the viewport */
  .viewer-block {
    width: 100%;
    height: 100vh !important;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  #viewer {
    width: 100%;
    height: 100vh;
    position: relative;
  }

  /* Panels */
  .info {
    max-height: 100vh;
    overflow-y: auto;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
    padding-bottom: 2rem;
    top: 0 !important;
    transform: none !important;
    align-items: flex-start !important;
    border: none !important;
  }
  .info::-webkit-scrollbar { display: none !important; width: 0 !important; }

  /* Back button */
  .top {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .back-btn {
    position: absolute !important;
    top: 50% !important;
    left: 1.4rem !important;
    transform: translateY(-50%) !important;
    background-color: #9aa76d; 
    color: #f0f5ee !important;
    border-radius: 20px !important;
    padding: 8px 18px !important;
    font-size: 12px !important;
    letter-spacing: .04em !important;
    text-decoration: none !important;
    font-family: 'Aboreto', serif !important;
    transition: background-color .2s, transform .2s !important;
    z-index: 10 !important;
  }
  .back-btn:hover {
    background-color: #5c9464 !important;
    transform: translateY(-50%) scale(1.04) !important;
  }

  /* Section block */
  .g-section      { margin-top: 1.5rem; width: 100%; }
  .g-section > h3 {
    font-size: .61rem; letter-spacing: .15em; text-transform: uppercase;
    color: #899064; margin-bottom: .7rem;
    padding-bottom: .28rem; border-bottom: 1px solid rgba(137,144,100,.22);
  }

  /* Slider row */
  .gctrl             { margin-bottom: .82rem; }
  .gctrl:last-child  { margin-bottom: 0; }
  .gctrl-head        { display: flex; justify-content: space-between; margin-bottom: .2rem; }
  .gctrl-head label  { font-size: .71rem; color: #4B3D1A; opacity: .72; }
  .gctrl-head .val   { font-size: .69rem; color: #7b4a46; font-variant-numeric: tabular-nums; min-width: 3rem; text-align: right; }

  /* Seed row */
  .seed-row             { display: flex; gap: 7px; align-items: center; width: 100%; }
  .seed-row input       { flex: 1; padding: 4px 8px; border: 1px solid rgba(137,144,100,.35); background: rgba(255,255,255,.45); border-radius: 4px; font-size: .71rem; color: #4B3D1A; font-family: monospace; outline: none; min-width: 0; }
  .seed-row input:focus { border-color: #899064; background: rgba(255,255,255,.7); }
  .seed-btn             { padding: 4px 10px; background: #7b4a46; color: #f5f0e6; border: none; border-radius: 4px; cursor: pointer; font-size: .77rem; white-space: nowrap; transition: background .2s; flex-shrink: 0; }
  .seed-btn:hover       { background: #9e5e58; }

  /* Season tabs */
  .season-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
  .stab {
    padding: 5px 0; font-size: .67rem; letter-spacing: .06em; text-transform: uppercase;
    text-align: center; border: 1px solid rgba(137,144,100,.32); border-radius: 3px;
    cursor: pointer; transition: all .18s; background: transparent; color: #4B3D1A; opacity: .68;
  }
  .stab:hover  { background: rgba(137,144,100,.13); opacity: 1; }
  .stab.active { border-color: #899064; background: rgba(137,144,100,.2); opacity: 1; font-weight: 500; }
  .stab[data-s="spring"]        { color: #5a8a40; }
  .stab[data-s="spring"].active { background: rgba(120,190,80,.17); border-color: #72b452; }
  .stab[data-s="summer"]        { color: #2e6e20; }
  .stab[data-s="summer"].active { background: rgba(60,120,40,.17); border-color: #3e8828; }
  /* Birch autumn */
  .stab[data-s="autumn"]        { color: #b07010; }
  .stab[data-s="autumn"].active { background: rgba(220,160,20,.20); border-color: #d4a018; }
  .stab[data-s="winter"]        { color: #6a7880; }
  .stab[data-s="winter"].active { background: rgba(100,120,130,.17); border-color: #7a9098; }

  /* Stat lines */
  .stat        { display: flex; justify-content: space-between; margin-bottom: .24rem; }
  .stat span   { font-size: .71rem; color: #4B3D1A; opacity: .58; }
  .stat strong { font-size: .71rem; color: #7b4a46; font-weight: 400; }

  .desc-text { font-size: .88rem; color: #4B3D1A; opacity: .75; line-height: 1.55; }

  .g-btn { width: 100%; margin-top: 1rem; padding: 8px; background: transparent; border: 1px solid rgba(137,144,100,.4); border-radius: 3px; font-size: .67rem; letter-spacing: .1em; text-transform: uppercase; color: #4B3D1A; opacity: .65; cursor: pointer; transition: all .18s; }
  .g-btn:hover { background: rgba(137,144,100,.11); opacity: 1; border-color: #899064; }

  .orbit-hint { margin-top: 1.2rem; font-size: .65rem; color: #899064; opacity: .48; text-align: center; letter-spacing: .05em; font-style: italic; line-height: 1.6; }

  /* Loading overlay */
  #loadingOverlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(230,215,196,.65); backdrop-filter: blur(4px);
    pointer-events: none; transition: opacity .35s; z-index: 10;
  }
  #loadingOverlay.hidden { opacity: 0; }
  .loader-ring { width: 30px; height: 30px; border: 1.5px solid #7b4a46; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 9px; }
  .loader-text { font-size: .67rem; letter-spacing: .14em; text-transform: uppercase; color: #4B3D1A; opacity: .6; text-align: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <header class="top">
    <a href="../web/index.html" class="back-btn">← Back</a>
    <h1>Jardin du Temps</h1>
    <h2 id="tree-name" class="tree-title"></h2>
  </header>

  <div class="oak-layout">


    <aside class="info left">

      <div class="g-section" style="margin-top:0">
        <h3>Species</h3>
        <p class="desc-text" style="font-style:italic" id="tree-species"></p>
      </div>

      <div class="g-section">
        <h3>Environment</h3>
        <p class="desc-text" id="tree-environment"></p>
      </div>

      <div class="g-section">
        <h3>Description</h3>
        <p class="desc-text" id="tree-description"></p>
      </div>

      <div class="g-section">
        <h3>Seed</h3>
        <div class="seed-row">
          <input type="number" id="seedInput" min="1" max="999999" value="73531" />
          <button class="seed-btn" id="btnRandom">⟳ New</button>
        </div>
      </div>

      <div class="g-section">
        <h3>Trunk</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Height at maturity</label><span class="val" id="v-height">25 m</span></div>
          <input type="range" id="sl-height" min="8" max="35" value="25" step="0.5" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Girth growth (cm/yr)</label><span class="val" id="v-girth">1.2</span></div>
          <input type="range" id="sl-girth" min="0.3" max="4" value="1.2" step="0.1" />
        </div>
      </div>

      <div class="g-section">
        <h3>Branching</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Branch count</label><span class="val" id="v-branches">9</span></div>
          <input type="range" id="sl-branches" min="2" max="14" value="9" step="1" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Spread angle offset</label><span class="val" id="v-angle">0°</span></div>
          <input type="range" id="sl-angle" min="-30" max="30" value="0" step="1" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Gnarliness</label><span class="val" id="v-gnarly">1.00×</span></div>
          <input type="range" id="sl-gnarly" min="0.1" max="4" value="1" step="0.05" />
        </div>
        <!-- ★ Birch signature: droop/weeping slider -->
        <div class="gctrl">
          <div class="gctrl-head"><label>Droop (weeping)</label><span class="val" id="v-droop">1.00×</span></div>
          <input type="range" id="sl-droop" min="0" max="3" value="1" step="0.05" />
        </div>
      </div>

    </aside>


    <main class="center">
      <div class="viewer-block">
        <div id="viewer">
          <div id="loadingOverlay">
            <div>
              <div class="loader-ring"></div>
              <div class="loader-text" id="loaderMsg">Growing…</div>
            </div>
          </div>
        </div>
      </div>
    </main>


    <aside class="info right">

      <div class="g-section" style="margin-top:0">
        <h3>Tree stats</h3>
        <div class="stat"><span>Height</span>      <strong id="stat-height">—</strong></div>
        <div class="stat"><span>Girth</span>       <strong id="stat-girth">—</strong></div>
        <div class="stat"><span>Branch depth</span><strong id="stat-depth">—</strong></div>
        <div class="stat"><span>Leaf pts</span>    <strong id="stat-leaves">—</strong></div>
      </div>

      <div class="g-section">
        <h3>Season</h3>
        <div class="season-tabs">
          <button class="stab" data-s="spring">Spring</button>
          <button class="stab active" data-s="summer">Summer</button>
          <!-- Autumn tab subtly highlighted — birch's most iconic season -->
          <button class="stab" data-s="autumn">Autumn</button>
          <button class="stab" data-s="winter">Winter</button>
        </div>
      </div>

      <div class="g-section">
        <h3>Leaves</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Density</label><span class="val" id="v-density">1.00×</span></div>
          <input type="range" id="sl-density" min="0.1" max="3" value="1" step="0.05" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Leaf size</label><span class="val" id="v-leafsize">1.00</span></div>
          <input type="range" id="sl-leafsize" min="0.3" max="2.5" value="1" step="0.05" />
        </div>
      </div>

      <div class="g-section">
        <h3>Environment</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Wind</label><span class="val" id="v-wind">0.30</span></div>
          <input type="range" id="sl-wind" min="0" max="1" value="0.3" step="0.02" />
        </div>
      </div>

      <button class="g-btn" id="btnRegen">↺ Regenerate tree</button>

      <div class="orbit-hint">
        drag to orbit · scroll to zoom<br>
        shift+drag to pan
      </div>

    </aside>

    <div class="stage-dots">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script type="module">
    import { generateBirch }                                       from './birchGen.js';
    import { buildThreeGeometry, buildThreeInstancedFoliage,
             animateWind }                                         from './threeAdapter.js';


    const THREE     = window.THREE;
    const container = document.getElementById('viewer');
    const overlay   = document.getElementById('loadingOverlay');
    const loaderMsg = document.getElementById('loaderMsg');

    let speciesData = null;
    let FIXED_AGE   = 90;      
    let treeGroup   = new THREE.Group();
    let foliageMesh = null;
    let windTime    = 0;
    let autoRotate  = true;

    
    //  SEASONS
    const SEASONS = {
      spring: { leafTint: 0xa8d870, leafOpacity: 0.85, ground: 0x92a86a, fogColor: 0xd8ead8 },
      summer: { leafTint: 0xffffff, leafOpacity: 1.00, ground: 0x82985a, fogColor: 0xd0ddd0 },
      autumn: { leafTint: 0xe8c020, leafOpacity: 0.90, ground: 0x9a8050, fogColor: 0xe0d4a8 },  // ★ golden
      winter: { leafTint: 0xffffff, leafOpacity: 0.00, ground: 0xa8a8a0, fogColor: 0xd8dce8 },  // bare
    };
    let currentSeason = 'summer';

    function applySeasonEnv(s) {
      const S = SEASONS[s];
      scene.fog.color.set(S.fogColor);
      ground.material.color.set(S.ground);
    }


    //  SCENE — transparent canvas

    const scene = new THREE.Scene();
    scene.fog   = new THREE.FogExp2(0xd0ddd0, 0.009);

    const camera   = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Lights 
    scene.add(new THREE.HemisphereLight(0xe8f0e8, 0x908060, 1.15));
    const sun = new THREE.DirectionalLight(0xfff8f0, 1.2);
    sun.position.set(8, 20, 8);
    sun.castShadow = true;
    Object.assign(sun.shadow.camera, { left:-22, right:22, bottom:-12, top:22, far:100 });
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xd0e8f8, 0.4);
    fill.position.set(-6, 8, -10);
    scene.add(fill);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(90, 48),
      new THREE.MeshLambertMaterial({ color: 0x82985a })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    scene.add(treeGroup);

    // Procedural birch bark 
    function makeBirchBarkTexture() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 1024;
      const ctx = cv.getContext('2d');

      const g = ctx.createLinearGradient(0, 0, cv.width, 0);
      g.addColorStop(0,   '#d6cdb6'); g.addColorStop(0.5, '#f1ead7'); g.addColorStop(1, '#d6cdb6');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);

      for (let i = 0; i < 28; i++) {
        const px = Math.random()*cv.width, py = Math.random()*cv.height, r = 25+Math.random()*55;
        const rg = ctx.createRadialGradient(px,py,0,px,py,r);
        rg.addColorStop(0, `rgba(176,138,90,${0.06+Math.random()*0.08})`);
        rg.addColorStop(1, 'rgba(176,138,90,0)');
        ctx.fillStyle = rg; ctx.fillRect(px-r,py-r,r*2,r*2);
      }
      for (let i = 0; i < 18; i++) {
        ctx.fillStyle = `rgba(72,54,36,${0.18+Math.random()*0.22})`;
        ctx.fillRect(Math.random()*cv.width, Math.random()*cv.height, 20+Math.random()*35, 4+Math.random()*8);
      }
    
      for (let i = 0; i < 480; i++) {
        ctx.fillStyle = `rgba(18,12,8,${0.55+Math.random()*0.42})`;
        ctx.fillRect(Math.random()*cv.width, Math.random()*cv.height, 8+Math.random()*42, 1+Math.random()*2.3);
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1.5, 3);
      return tex;
    }

    const trunkMat = new THREE.MeshStandardMaterial({ map: makeBirchBarkTexture(), color: 0xffffff, roughness: 0.85 });
    const leafTex  = new THREE.TextureLoader().load('pic/birch.png');
    const leafMat  = new THREE.MeshStandardMaterial({
      map: leafTex, transparent: true, alphaTest: 0.5,
      side: THREE.DoubleSide, depthWrite: false,
    });

    
    const orbit = { theta: 0.25, phi: 1.25, r: 28, tx: 0, ty: -5 };
    let isDragging = false, lastMouse = { x:0, y:0 };

    function updateCamera() {
      const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
      camera.position.set(
        orbit.tx + orbit.r * sp * Math.sin(orbit.theta),
        orbit.ty + orbit.r * cp,
        orbit.r  * sp * Math.cos(orbit.theta)
      );
      camera.lookAt(orbit.tx, orbit.ty, 0);
    }

    const cvs = renderer.domElement;
    cvs.addEventListener('mousedown', e => {
      isDragging = true; autoRotate = false;
      lastMouse = { x: e.clientX, y: e.clientY }; e.preventDefault();
    });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
      if (e.shiftKey) { orbit.tx -= dx * 0.025; orbit.ty += dy * 0.025; }
      else {
        orbit.theta -= dx * 0.007;
        orbit.phi = Math.max(0.10, Math.min(Math.PI * 0.46, orbit.phi + dy * 0.006));
      }
      lastMouse = { x: e.clientX, y: e.clientY };
      updateCamera();
    });
    cvs.addEventListener('wheel', e => {
      orbit.r = Math.max(6, Math.min(90, orbit.r + e.deltaY * 0.06));
      updateCamera(); e.preventDefault();
    }, { passive: false });
    cvs.addEventListener('touchstart', e => {
      isDragging = true; autoRotate = false;
      lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    cvs.addEventListener('touchend', () => isDragging = false, { passive: true });
    cvs.addEventListener('touchmove', e => {
      if (!isDragging) return;
      orbit.theta -= (e.touches[0].clientX - lastMouse.x) * 0.007;
      orbit.phi = Math.max(0.10, Math.min(Math.PI*0.46, orbit.phi + (e.touches[0].clientY-lastMouse.y)*0.006));
      lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      updateCamera();
    }, { passive: true });

    updateCamera();

    function onResize() {
      const w = container.clientWidth, h = container.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(onResize).observe(container);
    onResize();


    const n   = id => Number(document.getElementById(id).value);
    const $id = id => document.getElementById(id);

    function buildSpec(base) {
      const spec = JSON.parse(JSON.stringify(base));
      spec.seed                          = n('seedInput');
      spec.trunk.heightAtMaturity_m      = n('sl-height');
      spec.trunk.girthGrowth_cm_per_year = n('sl-girth');
      spec._branchCount                  = n('sl-branches');
      spec._branchAngleOffset            = n('sl-angle');
      spec._gnarlinessMult               = n('sl-gnarly');
      spec._droopMult                    = n('sl-droop');    // ★ birch-specific
      spec._foliageDensity               = n('sl-density');
      return spec;
    }

    
    function buildTree() {
      const age      = FIXED_AGE;
      const spec     = buildSpec(speciesData);
      const treeData = generateBirch(age, spec);
      const S        = SEASONS[currentSeason];

    
      treeData.densityMult       = n('sl-density');
      treeData.leafOpacity       = S.leafOpacity;
      treeData.leafTint          = S.leafTint;
      treeData.leafScaleOverride = n('sl-leafsize');

      const group = new THREE.Group();

      const mesh = new THREE.Mesh(buildThreeGeometry(treeData, age), trunkMat);
      mesh.castShadow = mesh.receiveShadow = true;
      group.add(mesh);

      foliageMesh = null;
      if (treeData.foliage.length > 0 && S.leafOpacity > 0.01) {
        const fm = buildThreeInstancedFoliage(treeData, leafMat, age, age);
        group.add(fm);
        foliageMesh = fm;
      }

      // Birch scale 
      group.scale.setScalar(0.55);
      group.position.y = -12;

      // Camera 
      const gf  = Math.min(age / speciesData.age.max, 1);
      const hF  = 1 - Math.pow(1 - gf, 1.8);
      const h   = spec.trunk.heightAtMaturity_m * hF;
      orbit.ty  = -12 + h * 0.55 * 0.5;
      updateCamera();

      // Stats
      const circ = (spec.trunk.girthGrowth_cm_per_year * age / 100).toFixed(2);
      const maxD = age < 10 ? 1 : age < 35 ? 2 : 3;
      $id('stat-height').textContent  = `${h.toFixed(1)} m`;
      $id('stat-girth').textContent   = `${circ} m`;
      $id('stat-depth').textContent   = `level ${maxD}`;
      $id('stat-leaves').textContent  = treeData.foliage.length.toLocaleString();

      return group;
    }

    
    //  UPDATE

    let pending = false;

    function updateTree() {
      if (!speciesData || pending) return;
      pending = true;
      overlay.classList.remove('hidden');
      loaderMsg.textContent = 'Growing…';

      requestAnimationFrame(() => requestAnimationFrame(() => {
        try {
          scene.remove(treeGroup);
          treeGroup.traverse(c => { if (c.geometry) c.geometry.dispose(); });

          treeGroup = buildTree();
          scene.add(treeGroup);
        } catch (err) {
          console.error('[birch.html] buildTree error:', err);
          loaderMsg.textContent = 'Error: ' + err.message;
          pending = false;
          return;
        }
        overlay.classList.add('hidden');
        pending = false;
      }));
    }

    window.addEventListener('resize', onResize);

    
    //  CONTROL WIRING

    const CTRLS = [
      { id: 'sl-height',   vid: 'v-height',   fmt: v => `${parseFloat(v).toFixed(1)} m`,  live: false },
      { id: 'sl-girth',    vid: 'v-girth',    fmt: v => parseFloat(v).toFixed(1),          live: false },
      { id: 'sl-branches', vid: 'v-branches', fmt: v => v,                                 live: false },
      { id: 'sl-angle',    vid: 'v-angle',    fmt: v => `${v}°`,                           live: false },
      { id: 'sl-gnarly',   vid: 'v-gnarly',   fmt: v => `${parseFloat(v).toFixed(2)}×`,    live: false },
      { id: 'sl-droop',    vid: 'v-droop',    fmt: v => `${parseFloat(v).toFixed(2)}×`,    live: false },
      { id: 'sl-density',  vid: 'v-density',  fmt: v => `${parseFloat(v).toFixed(2)}×`,    live: false },
      { id: 'sl-leafsize', vid: 'v-leafsize', fmt: v => parseFloat(v).toFixed(2),           live: false },
      { id: 'sl-wind',     vid: 'v-wind',     fmt: v => parseFloat(v).toFixed(2),           live: true  },
    ];

    CTRLS.forEach(({ id, vid, fmt, live }) => {
      const el = $id(id), out = $id(vid);
      if (!el || !out) return;
      out.textContent = fmt(el.value);
      el.addEventListener('input', () => {
        out.textContent = fmt(el.value);
        if (!live && speciesData) updateTree();
      });
    });

    // Seasons
    document.querySelectorAll('.stab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSeason = btn.dataset.s;
        applySeasonEnv(currentSeason);
        if (speciesData) updateTree();   // rebuild for leaf opacity change
      });
    });

    $id('btnRandom').addEventListener('click', () => {
      $id('seedInput').value = Math.floor(Math.random() * 999998) + 1;
      if (speciesData) updateTree();
    });
    $id('seedInput').addEventListener('change', () => {
      if (speciesData) updateTree();
    });
    $id('btnRegen').addEventListener('click', () => {
      if (speciesData) updateTree();
    });

  
    //  RENDER LOOP
    
    let lastTs = 0;
    (function animate(ts) {
      requestAnimationFrame(animate);
      const dt  = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs    = ts;
      windTime += dt;

      if (autoRotate) { orbit.theta += dt * 0.16; updateCamera(); }

      if (foliageMesh) {
        const ws = n('sl-wind');
        if (ws > 0.01) animateWind(foliageMesh, windTime, ws);
      }

      renderer.render(scene, camera);
    })(0);

  
    //  LOAD birch.json

    fetch('./birch.json')
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => {
        speciesData = data;

        FIXED_AGE = Math.round(data.age.max * 0.6);   // 90 years — mature birch

        $id('tree-name').textContent      = data.commonName;
        $id('tree-species').textContent   = data.species;
        $id('tree-environment').innerHTML = 'Temperate &amp; boreal forests<br>Europe, Siberia, Asia Minor';
        $id('tree-description').textContent =
          'A graceful pioneer species recognised by its white papery bark and horizontal ' +
          'black lenticels. Silver birch lives up to 150 years and is often the first tree ' +
          'to colonise disturbed ground — its leaves prepare the soil for slower-growing forests.';

        // Sync sliders from json
        $id('sl-height').value   = data.trunk.heightAtMaturity_m;
        $id('sl-girth').value    = data.trunk.girthGrowth_cm_per_year;
        $id('sl-branches').value = data.branching.primaryBranchCount;
        $id('v-height').textContent   = `${parseFloat(data.trunk.heightAtMaturity_m).toFixed(1)} m`;
        $id('v-girth').textContent    = parseFloat(data.trunk.girthGrowth_cm_per_year).toFixed(1);
        $id('v-branches').textContent = data.branching.primaryBranchCount;

        applySeasonEnv(currentSeason);
        updateTree();
      })
      .catch(err => {
        console.error('[birch.html] Failed to load birch.json:', err);
        loaderMsg.textContent = 'Failed to load birch.json';
      });
  </script>

</body>
</html>
