<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>English Oak — Jardin du Temps</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

  <style>


  /* Override viewer to fill full viewport height, no scroll-space needed */
  .oak-layout    { min-height: 100vh; }
  .viewer-block  { height: 100vh; justify-content: center; }
  #viewer        { width: 100%; flex: 1; position: relative; }

  /* Center column: no extra scroll space */
  .scroll-space  { display: none; }
  .age-control   { display: none; }   /* hide age slider if any remnant */

  /* Both side panels: full-height sticky column, scrollable internally */
  .info {
    max-height: 100vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(137,144,100,.3) transparent;
    padding-bottom: 2rem;
    top: 0;
    transform: none;
    /* ★ left-align all children so g-section text doesn't center-float */
    align-items: flex-start !important;
  }
  .info::-webkit-scrollbar       { width: 3px; }
  .info::-webkit-scrollbar-thumb { background: rgba(137,144,100,.3); border-radius: 2px; }

  /* Section block */
  .g-section        { margin-top: 1.5rem; width: 100%; }
  .g-section > h3   {
    font-size: 0.61rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: #899064; margin-bottom: 0.7rem;
    padding-bottom: 0.28rem; border-bottom: 1px solid rgba(137,144,100,.22);
  }

  /* Slider row */
  .gctrl              { margin-bottom: 0.82rem; }
  .gctrl:last-child   { margin-bottom: 0; }
  .gctrl-head         { display: flex; justify-content: space-between; margin-bottom: .2rem; }
  .gctrl-head label   { font-size: .71rem; color: #4B3D1A; opacity: .72; }
  .gctrl-head .val    { font-size: .69rem; color: #7b4a46; font-variant-numeric: tabular-nums; min-width: 3rem; text-align: right; }

  /* Seed row */
  .seed-row             { display: flex; gap: 7px; align-items: center; width: 100%; }
  .seed-row input       { flex: 1; padding: 4px 8px; border: 1px solid rgba(137,144,100,.35); background: rgba(255,255,255,.45); border-radius: 4px; font-size: .71rem; color: #4B3D1A; font-family: monospace; outline: none; min-width: 0; }
  .seed-row input:focus { border-color: #899064; background: rgba(255,255,255,.7); }
  .seed-btn             { padding: 4px 10px; background: #7b4a46; color: #f5f0e6; border: none; border-radius: 4px; cursor: pointer; font-size: .77rem; white-space: nowrap; transition: background .2s; flex-shrink: 0; }
  .seed-btn:hover       { background: #9e5e58; }

  /* Season tabs */
  .season-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
  .stab {
    padding: 5px 0; font-size: .67rem; letter-spacing: .06em; text-transform: uppercase;
    text-align: center; border: 1px solid rgba(137,144,100,.32); border-radius: 3px;
    cursor: pointer; transition: all .18s; background: transparent; color: #4B3D1A; opacity: .68;
  }
  .stab:hover { background: rgba(137,144,100,.13); opacity: 1; }
  .stab.active { border-color: #899064; background: rgba(137,144,100,.2); opacity: 1; font-weight: 500; }
  .stab[data-s="spring"]        { color: #4a7a38; }
  .stab[data-s="spring"].active { background: rgba(100,180,80,.17);  border-color: #6ab450; }
  .stab[data-s="summer"]        { color: #2e6e20; }
  .stab[data-s="summer"].active { background: rgba(60,120,40,.17);   border-color: #3e8828; }
  .stab[data-s="autumn"]        { color: #a05c18; }
  .stab[data-s="autumn"].active { background: rgba(180,100,30,.17);  border-color: #c07028; }
  .stab[data-s="winter"]        { color: #6a7880; }
  .stab[data-s="winter"].active { background: rgba(100,120,130,.17); border-color: #7a9098; }

  /* Stat lines */
  .stat         { display: flex; justify-content: space-between; margin-bottom: .24rem; }
  .stat span    { font-size: .71rem; color: #4B3D1A; opacity: .58; }
  .stat strong  { font-size: .71rem; color: #7b4a46; font-weight: 400; }

  /* Divider line inside description area */
  .desc-text { font-size: .88rem; color: #4B3D1A; opacity: .75; line-height: 1.55; }

  /* Action button */
  .g-btn { width: 100%; margin-top: 1rem; padding: 8px; background: transparent; border: 1px solid rgba(137,144,100,.4); border-radius: 3px; font-size: .67rem; letter-spacing: .1em; text-transform: uppercase; color: #4B3D1A; opacity: .65; cursor: pointer; transition: all .18s; }
  .g-btn:hover { background: rgba(137,144,100,.11); opacity: 1; border-color: #899064; }

  /* Back button — inside header, green, left-pinned */
  .top {
    position: relative;   /* anchor for absolute back-btn */
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .back-btn {
    /* override style.css fixed+black */
    position: absolute !important;
    top: 50% !important;
    left: 1.4rem !important;
    transform: translateY(-50%) !important;
    background-color: #9aa76d;   /* forest green */
    color: #f0f5ee !important;
    border-radius: 20px !important;
    padding: 8px 18px !important;
    font-size: 12px !important;
    letter-spacing: 0.04em !important;
    text-decoration: none !important;
    font-family: 'Aboreto', serif !important;
    transition: background-color 0.2s, transform 0.2s !important;
    z-index: 10 !important;
  }
  .back-btn:hover {
    background-color: #5c9464 !important;
    transform: translateY(-50%) scale(1.04) !important;
  }

  /* Orbit hint */
  .orbit-hint { margin-top: 1.2rem; font-size: .65rem; color: #899064; opacity: .48; text-align: center; letter-spacing: .05em; font-style: italic; line-height: 1.6; }

  /* Loading overlay — uses body bg so it blends into transparent canvas */
  #loadingOverlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(230, 215, 196, .62); backdrop-filter: blur(4px);
    pointer-events: none; transition: opacity .35s; z-index: 10;
  }
  #loadingOverlay.hidden { opacity: 0; }
  .loader-ring { width: 30px; height: 30px; border: 1.5px solid #7b4a46; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 9px; }
  .loader-text { font-size: .67rem; letter-spacing: .14em; text-transform: uppercase; color: #4B3D1A; opacity: .6; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Stage dots hidden — no age stages */
  .stage-dots { display: none; }
  </style>
</head>

<body>

  <header class="top">
    <a href="../web/index.html" class="back-btn">← Back</a>
    <h1>Jardin du Temps</h1>
    <h2 id="tree-name" class="tree-title"></h2>
  </header>

  <div class="oak-layout">

  
    <aside class="info left">

  
      <div class="g-section" style="margin-top:0">
        <h3>Species</h3>
        <p class="desc-text" style="font-style:italic" id="tree-species"></p>
      </div>

      <div class="g-section">
        <h3>Environment</h3>
        <p class="desc-text" id="tree-environment"></p>
      </div>

      <div class="g-section">
        <h3>Description</h3>
        <p class="desc-text" id="tree-description"></p>
      </div>

      <div class="g-section">
        <h3>Seed</h3>
        <div class="seed-row">
          <input type="number" id="seedInput" min="1" max="999999" value="99999" />
          <button class="seed-btn" id="btnRandom">⟳ New</button>
        </div>
      </div>

      <div class="g-section">
        <h3>Trunk</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Height at maturity</label><span class="val" id="v-height">38 m</span></div>
          <input type="range" id="sl-height" min="10" max="55" value="38" step="1" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Girth growth (cm/yr)</label><span class="val" id="v-girth">2.0</span></div>
          <input type="range" id="sl-girth" min="0.5" max="6" value="2" step="0.1" />
        </div>
      </div>

      <div class="g-section">
        <h3>Branching</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Primary branches</label><span class="val" id="v-primaries">6</span></div>
          <input type="range" id="sl-primaries" min="2" max="10" value="6" step="1" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Branch angle offset</label><span class="val" id="v-angle">0°</span></div>
          <input type="range" id="sl-angle" min="-25" max="25" value="0" step="1" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Crown spread</label><span class="val" id="v-crown">1.00×</span></div>
          <input type="range" id="sl-crown" min="0.3" max="2.2" value="1" step="0.05" />
        </div>
      </div>

    </aside>


    <main class="center">
      <div class="viewer-block">
        <div id="viewer">
          <div id="loadingOverlay">
            <div>
              <div class="loader-ring"></div>
              <div class="loader-text">Growing…</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    
    <aside class="info right">

      <div class="g-section" style="margin-top:0">
        <h3>Tree stats</h3>
        <div class="stat"><span>Height</span>       <strong id="stat-height">—</strong></div>
        <div class="stat"><span>Girth</span>        <strong id="stat-girth">—</strong></div>
        <div class="stat"><span>Branch depth</span> <strong id="stat-depth">—</strong></div>
        <div class="stat"><span>Foliage pts</span>  <strong id="stat-leaves">—</strong></div>
      </div>

      <div class="g-section">
        <h3>Season</h3>
        <div class="season-tabs">
          <button class="stab" data-s="spring">Spring</button>
          <button class="stab active" data-s="summer">Summer</button>
          <button class="stab" data-s="autumn">Autumn</button>
          <button class="stab" data-s="winter">Winter</button>
        </div>
      </div>

      <div class="g-section">
        <h3>Foliage</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Density</label><span class="val" id="v-density">1.00×</span></div>
          <input type="range" id="sl-density" min="0.1" max="2.5" value="1" step="0.05" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Leaf size</label><span class="val" id="v-leafsize">1.20</span></div>
          <input type="range" id="sl-leafsize" min="0.3" max="2.8" value="1.2" step="0.05" />
        </div>
      </div>

      <div class="g-section">
        <h3>Environment</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Gnarliness</label><span class="val" id="v-gnarly">1.00×</span></div>
          <input type="range" id="sl-gnarly" min="0.1" max="3.5" value="1" step="0.05" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Gravity</label><span class="val" id="v-gravity">1.00×</span></div>
          <input type="range" id="sl-gravity" min="0" max="3" value="1" step="0.05" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Wind</label><span class="val" id="v-wind">0.30</span></div>
          <input type="range" id="sl-wind" min="0" max="1" value="0.3" step="0.02" />
        </div>
      </div>

      <button class="g-btn" id="btnRegen">↺ Regenerate tree</button>

      <div class="orbit-hint">
        drag to orbit · scroll to zoom<br>
        shift+drag to pan
      </div>

    </aside>

    <!-- dots hidden via CSS -->
    <div class="stage-dots">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script type="module">
    import { generateOak }                                        from './oakGen.js';
    import { buildThreeGeometry, buildThreeInstancedFoliage,
             animateWind }                                        from './threeAdapter.js';

    
    const THREE     = window.THREE;
    const container = document.getElementById('viewer');
    const overlay   = document.getElementById('loadingOverlay');

    let speciesData  = null;
    let FIXED_AGE    = 300;   // render at this age; set from oak.json on load
    let treeGroup, foliageMesh = null;
    let windTime = 0, autoRotate = true;

    
    const SEASONS = {
      spring: { leafTint: 0x90d050, leafOpacity: 0.82, ground: 0x9ec880, fogColor: 0xddeedd },
      summer: { leafTint: 0xffffff, leafOpacity: 1.00, ground: 0x8a9e6e, fogColor: 0xdde8d8 },
      autumn: { leafTint: 0xd06820, leafOpacity: 0.72, ground: 0x9a8060, fogColor: 0xe8dcc8 },
      winter: { leafTint: 0xffffff, leafOpacity: 0.00, ground: 0xa8aaa0, fogColor: 0xdde0e8 },
    };
    let currentSeason = 'summer';

    function applySeasonEnv(s) {
      const S = SEASONS[s];
      scene.fog.color.set(S.fogColor);
      ground.material.color.set(S.ground);
    }

    
    const scene  = new THREE.Scene();
    // No scene.background — canvas is transparent, body CSS shows through
    scene.fog = new THREE.FogExp2(0xdde8d8, 0.009);

    const camera   = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
    // alpha:true → transparent canvas
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);   // fully transparent clear
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.HemisphereLight(0xd4e8c8, 0x907848, 1.15));
    const sun = new THREE.DirectionalLight(0xfff8e8, 1.35);
    sun.position.set(8, 20, 7);
    sun.castShadow = true;
    Object.assign(sun.shadow.camera, { left:-28, right:28, bottom:-14, top:28, far:110 });
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xb8d8f0, 0.38);
    fill.position.set(-6, 8, -10);
    scene.add(fill);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(90, 48),
      new THREE.MeshLambertMaterial({ color: 0x8a9e6e })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Materials
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3728, roughness: 0.95 });
    const leafTex  = new THREE.TextureLoader().load('pic/leaf-oak.png');
    const leafMat  = new THREE.MeshStandardMaterial({
      map: leafTex, transparent: true, alphaTest: 0.5,
      side: THREE.DoubleSide, depthWrite: false,
    });

    treeGroup = new THREE.Group();
    scene.add(treeGroup);

  
    const orbit = { theta: 0.25, phi: 1.22, r: 26, tx: 0, ty: -5 };
    let isDragging = false, lastMouse = { x:0, y:0 };

    function updateCamera() {
      const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
      camera.position.set(
        orbit.tx + orbit.r * sp * Math.sin(orbit.theta),
        orbit.ty + orbit.r * cp,
        orbit.r * sp * Math.cos(orbit.theta)
      );
      camera.lookAt(orbit.tx, orbit.ty, 0);
    }

    const cvs = renderer.domElement;
    cvs.addEventListener('mousedown', e => {
      isDragging = true; autoRotate = false;
      lastMouse = { x: e.clientX, y: e.clientY }; e.preventDefault();
    });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
      if (e.shiftKey) { orbit.tx -= dx * 0.025; orbit.ty += dy * 0.025; }
      else {
        orbit.theta -= dx * 0.007;
        orbit.phi = Math.max(0.12, Math.min(Math.PI * 0.48, orbit.phi + dy * 0.006));
      }
      lastMouse = { x: e.clientX, y: e.clientY };
      updateCamera();
    });
    cvs.addEventListener('wheel', e => {
      orbit.r = Math.max(5, Math.min(90, orbit.r + e.deltaY * 0.06));
      updateCamera(); e.preventDefault();
    }, { passive: false });
    cvs.addEventListener('touchstart', e => {
      isDragging = true; autoRotate = false;
      lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    cvs.addEventListener('touchend', () => isDragging = false, { passive: true });
    cvs.addEventListener('touchmove', e => {
      if (!isDragging) return;
      const dx = e.touches[0].clientX - lastMouse.x, dy = e.touches[0].clientY - lastMouse.y;
      orbit.theta -= dx * 0.007;
      orbit.phi = Math.max(0.12, Math.min(Math.PI * 0.48, orbit.phi + dy * 0.006));
      lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      updateCamera();
    }, { passive: true });

    updateCamera();

    function onResize() {
      const w = container.clientWidth, h = container.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(onResize).observe(container);
    onResize();


    const n   = id => Number(document.getElementById(id).value);
    const $id = id => document.getElementById(id);

    function buildSpec(base) {
      const spec = JSON.parse(JSON.stringify(base));
      spec.seed                          = n('seedInput');
      spec.trunk.heightAtMaturity_m      = n('sl-height');
      spec.trunk.girthGrowth_cm_per_year = n('sl-girth');
      spec.branching.primaryBranchCount  = n('sl-primaries');
      spec._branchAngleOffset            = n('sl-angle');
      spec._gnarlinessMult               = n('sl-gnarly');
      spec._gravityMult                  = n('sl-gravity');
      spec._crownSpread                  = n('sl-crown');
      spec._foliageDensity               = n('sl-density');
      return spec;
    }


    function buildTree() {
      const age      = FIXED_AGE;
      const spec     = buildSpec(speciesData);
      const treeData = generateOak(age, spec);
      const S        = SEASONS[currentSeason];

      treeData.densityMult = n('sl-density');
      treeData.leafOpacity = S.leafOpacity;
      treeData.leafTint    = S.leafTint;

      const group = new THREE.Group();

      const mesh = new THREE.Mesh(buildThreeGeometry(treeData, age), trunkMat);
      mesh.castShadow = mesh.receiveShadow = true;
      group.add(mesh);

      foliageMesh = null;
      if (treeData.foliage.length > 0) {
        const ls = n('sl-leafsize');
        const fm = buildThreeInstancedFoliage(treeData, leafMat, age, age, ls, ls * 1.12);
        group.add(fm);
        foliageMesh = fm;
      }

      group.scale.setScalar(0.4);
      group.position.y = -12;

      // Camera look-at target: mid-trunk height
      const gf   = Math.min(age / 500, 1);
      const h    = spec.trunk.heightAtMaturity_m * Math.pow(gf, 0.75);
      orbit.ty   = -12 + h * 0.4 * 0.52;
      updateCamera();

      // Stats
      const circ = (spec.trunk.girthGrowth_cm_per_year * age / 100).toFixed(2);
      const maxD = age<10?0 : age<30?1 : age<80?2 : age<150?3 : age<300?4 : 5;
      $id('stat-height').textContent = `${h.toFixed(1)} m`;
      $id('stat-girth').textContent  = `${circ} m`;
      $id('stat-depth').textContent  = `level ${maxD}`;
      $id('stat-leaves').textContent = treeData.foliage.length.toLocaleString();

      return group;
    }


    let pending = false;

    function updateTree() {
      if (!speciesData || pending) return;
      pending = true;
      overlay.classList.remove('hidden');

      requestAnimationFrame(() => requestAnimationFrame(() => {
        scene.remove(treeGroup);
        treeGroup.traverse(c => c.geometry?.dispose());

        treeGroup = buildTree();
        scene.add(treeGroup);

        overlay.classList.add('hidden');
        pending = false;
      }));
    }

    window.addEventListener('resize', onResize);


    const CTRLS = [
      { id: 'sl-height',    vid: 'v-height',    fmt: v => `${v} m`,                       live: false },
      { id: 'sl-girth',     vid: 'v-girth',     fmt: v => parseFloat(v).toFixed(1),        live: false },
      { id: 'sl-primaries', vid: 'v-primaries',  fmt: v => v,                              live: false },
      { id: 'sl-angle',     vid: 'v-angle',     fmt: v => `${v}°`,                         live: false },
      { id: 'sl-crown',     vid: 'v-crown',     fmt: v => `${parseFloat(v).toFixed(2)}×`,  live: false },
      { id: 'sl-gnarly',    vid: 'v-gnarly',    fmt: v => `${parseFloat(v).toFixed(2)}×`,  live: false },
      { id: 'sl-gravity',   vid: 'v-gravity',   fmt: v => `${parseFloat(v).toFixed(2)}×`,  live: false },
      { id: 'sl-wind',      vid: 'v-wind',      fmt: v => parseFloat(v).toFixed(2),         live: true  },
      { id: 'sl-density',   vid: 'v-density',   fmt: v => `${parseFloat(v).toFixed(2)}×`,  live: false },
      { id: 'sl-leafsize',  vid: 'v-leafsize',  fmt: v => parseFloat(v).toFixed(2),         live: false },
    ];

    CTRLS.forEach(({ id, vid, fmt, live }) => {
      const el = $id(id), out = $id(vid);
      if (!el || !out) return;
      out.textContent = fmt(el.value);
      el.addEventListener('input', () => {
        out.textContent = fmt(el.value);
        if (!live && speciesData) updateTree();
      });
    });

    // Seasons
    document.querySelectorAll('.stab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSeason = btn.dataset.s;
        applySeasonEnv(currentSeason);
        if (speciesData) updateTree();
      });
    });

    // Seed
    $id('btnRandom').addEventListener('click', () => {
      $id('seedInput').value = Math.floor(Math.random() * 999998) + 1;
      if (speciesData) updateTree();
    });
    $id('seedInput').addEventListener('change', () => {
      if (speciesData) updateTree();
    });

    // Regen
    $id('btnRegen').addEventListener('click', () => {
      if (speciesData) updateTree();
    });

  
    //  RENDER LOOP
   
    let lastTs = 0;
    (function animate(ts) {
      requestAnimationFrame(animate);
      const dt  = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs    = ts;
      windTime += dt;

      if (autoRotate) { orbit.theta += dt * 0.18; updateCamera(); }

      if (foliageMesh) {
        const ws = n('sl-wind');
        if (ws > 0.01) animateWind(foliageMesh, windTime, ws);
      }

      renderer.render(scene, camera);
    })(0);

   
    //  LOAD oak.json

    fetch('./oak.json')
      .then(r => r.json())
      .then(data => {
        speciesData = data;
        trunkMat.color.set(data.trunk.barkColor);

        // Use 60% of max age as default 
        FIXED_AGE = Math.round(data.age.max * 0.6);

        $id('tree-name').textContent      = data.commonName;
        $id('tree-species').textContent   = data.species;
        $id('tree-environment').innerHTML = 'Temperate broadleaf forests<br>Europe &amp; Western Asia';
        $id('tree-description').textContent =
          'One of the longest-lived trees in Europe, the English Oak can survive over ' +
          '500 years, and supports more native species than any other British tree.';

        // Init panel sliders from json
        $id('sl-height').value    = data.trunk.heightAtMaturity_m;
        $id('sl-girth').value     = data.trunk.girthGrowth_cm_per_year;
        $id('sl-primaries').value = data.branching.primaryBranchCount;
        $id('v-height').textContent    = `${data.trunk.heightAtMaturity_m} m`;
        $id('v-girth').textContent     = parseFloat(data.trunk.girthGrowth_cm_per_year).toFixed(1);
        $id('v-primaries').textContent = data.branching.primaryBranchCount;

        applySeasonEnv(currentSeason);
        updateTree();
      })
      .catch(err => {
        console.error('[grove.html] Failed to load oak.json:', err);
        overlay.querySelector('.loader-text').textContent = 'Failed to load data';
      });
  </script>

</body>
</html>
