<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weeping Willow — Jardin du Temps</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">

  <style>

  .oak-layout   { min-height: 100vh; }
  .scroll-space { display: none; }
  .age-control  { display: none; }
  .stage-dots   { display: none; }

  .viewer-block {
    width: 100%;
    height: 100vh !important;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  #viewer { width: 100%; height: 100vh; position: relative; }

  /* Panels */
  .info {
    max-height: 100vh;
    overflow-y: auto;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
    padding-bottom: 2rem;
    top: 0 !important;
    transform: none !important;
    align-items: flex-start !important;
    border: none !important;
  }
  .info::-webkit-scrollbar { display: none !important; width: 0 !important; }

  /* Back button */
  .top { position: relative; display: flex; flex-direction: column; align-items: center; }
  .back-btn {
    position: absolute !important; top: 50% !important; left: 1.4rem !important;
    transform: translateY(-50%) !important; background-color: #9aa76d; 
    color: #f0f5ee !important; border-radius: 20px !important; padding: 8px 18px !important;
    font-size: 12px !important; letter-spacing: .04em !important; text-decoration: none !important;
    font-family: 'Aboreto', serif !important; transition: background-color .2s, transform .2s !important;
    z-index: 10 !important;
  }
  .back-btn:hover { background-color: #5c9464 !important; transform: translateY(-50%) scale(1.04) !important; }

  /* Section block */
  .g-section      { margin-top: 1.5rem; width: 100%; }
  .g-section > h3 {
    font-size: .61rem; letter-spacing: .15em; text-transform: uppercase;
    color: #899064; margin-bottom: .7rem;
    padding-bottom: .28rem; border-bottom: 1px solid rgba(137,144,100,.22);
  }

  /* Slider row */
  .gctrl             { margin-bottom: .82rem; }
  .gctrl:last-child  { margin-bottom: 0; }
  .gctrl-head        { display: flex; justify-content: space-between; margin-bottom: .2rem; }
  .gctrl-head label  { font-size: .71rem; color: #4B3D1A; opacity: .72; }
  .gctrl-head .val   { font-size: .69rem; color: #7b4a46; font-variant-numeric: tabular-nums; min-width: 3rem; text-align: right; }

  /* Seed row */
  .seed-row             { display: flex; gap: 7px; align-items: center; width: 100%; }
  .seed-row input       { flex: 1; padding: 4px 8px; border: 1px solid rgba(137,144,100,.35); background: rgba(255,255,255,.45); border-radius: 4px; font-size: .71rem; color: #4B3D1A; font-family: monospace; outline: none; min-width: 0; }
  .seed-row input:focus { border-color: #899064; background: rgba(255,255,255,.7); }
  .seed-btn             { padding: 4px 10px; background: #7b4a46; color: #f5f0e6; border: none; border-radius: 4px; cursor: pointer; font-size: .77rem; white-space: nowrap; transition: background .2s; flex-shrink: 0; }
  .seed-btn:hover       { background: #9e5e58; }

  /* Season tabs */
  .season-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
  .stab {
    padding: 5px 0; font-size: .67rem; letter-spacing: .06em; text-transform: uppercase;
    text-align: center; border: 1px solid rgba(137,144,100,.32); border-radius: 3px;
    cursor: pointer; transition: all .18s; background: transparent; color: #4B3D1A; opacity: .68;
  }
  .stab:hover  { background: rgba(137,144,100,.13); opacity: 1; }
  .stab.active { border-color: #899064; background: rgba(137,144,100,.2); opacity: 1; font-weight: 500; }
  .stab[data-s="spring"]        { color: #5a9a40; }
  .stab[data-s="spring"].active { background: rgba(100,200,80,.18); border-color: #6aba50; }
  .stab[data-s="summer"]        { color: #2a6e28; }
  .stab[data-s="summer"].active { background: rgba(50,120,40,.17); border-color: #3a8828; }
  .stab[data-s="autumn"]        { color: #8a7010; }
  .stab[data-s="autumn"].active { background: rgba(180,150,20,.18); border-color: #c09820; }
  .stab[data-s="winter"]        { color: #607080; }
  .stab[data-s="winter"].active { background: rgba(90,110,130,.17); border-color: #7090a8; }

  /* Stat lines */
  .stat        { display: flex; justify-content: space-between; margin-bottom: .24rem; }
  .stat span   { font-size: .71rem; color: #4B3D1A; opacity: .58; }
  .stat strong { font-size: .71rem; color: #7b4a46; font-weight: 400; }

  .desc-text { font-size: .88rem; color: #4B3D1A; opacity: .75; line-height: 1.55; }

  .g-btn { width: 100%; margin-top: 1rem; padding: 8px; background: transparent; border: 1px solid rgba(137,144,100,.4); border-radius: 3px; font-size: .67rem; letter-spacing: .1em; text-transform: uppercase; color: #4B3D1A; opacity: .65; cursor: pointer; transition: all .18s; }
  .g-btn:hover { background: rgba(137,144,100,.11); opacity: 1; border-color: #899064; }

  .orbit-hint { margin-top: 1.2rem; font-size: .65rem; color: #899064; opacity: .48; text-align: center; letter-spacing: .05em; font-style: italic; line-height: 1.6; }

  #loadingOverlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(230,215,196,.65); backdrop-filter: blur(4px);
    pointer-events: none; transition: opacity .35s; z-index: 10;
  }
  #loadingOverlay.hidden { opacity: 0; }
  .loader-ring { width: 30px; height: 30px; border: 1.5px solid #7b4a46; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 9px; }
  .loader-text { font-size: .67rem; letter-spacing: .14em; text-transform: uppercase; color: #4B3D1A; opacity: .6; text-align: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <header class="top">
    <a href="../web/index.html" class="back-btn">← Back</a>
    <h1>Jardin du Temps</h1>
    <h2 id="tree-name" class="tree-title"></h2>
  </header>

  <div class="oak-layout">


    <aside class="info left">

      <div class="g-section" style="margin-top:0">
        <h3>Species</h3>
        <p class="desc-text" style="font-style:italic" id="tree-species"></p>
      </div>
      <div class="g-section">
        <h3>Environment</h3>
        <p class="desc-text" id="tree-environment"></p>
      </div>
      <div class="g-section">
        <h3>Description</h3>
        <p class="desc-text" id="tree-description"></p>
      </div>

      <div class="g-section">
        <h3>Seed</h3>
        <div class="seed-row">
          <input type="number" id="seedInput" min="1" max="999999" value="38291" />
          <button class="seed-btn" id="btnRandom">⟳ New</button>
        </div>
      </div>

      <div class="g-section">
        <h3>Trunk</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Height at maturity</label><span class="val" id="v-height">20 m</span></div>
          <input type="range" id="sl-height" min="6" max="32" value="20" step="0.5" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Girth growth (cm/yr)</label><span class="val" id="v-girth">2.2</span></div>
          <input type="range" id="sl-girth" min="0.5" max="6" value="2.2" step="0.1" />
        </div>
      </div>

      <div class="g-section">
        <!-- Willow-specific: cascade shape controls -->
        <h3>Cascade</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Droop (weeping)</label><span class="val" id="v-droop">1.00×</span></div>
          <input type="range" id="sl-droop" min="0" max="3.5" value="1" step="0.05" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Crown base</label><span class="val" id="v-crownbase">0.35</span></div>
          <input type="range" id="sl-crownbase" min="0.05" max="0.70" value="0.35" step="0.01" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Primary branches</label><span class="val" id="v-primary">7</span></div>
          <input type="range" id="sl-primary" min="2" max="12" value="7" step="1" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Spread angle offset</label><span class="val" id="v-angle">0°</span></div>
          <input type="range" id="sl-angle" min="-25" max="25" value="0" step="1" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Gnarliness</label><span class="val" id="v-gnarly">1.00×</span></div>
          <input type="range" id="sl-gnarly" min="0.1" max="4" value="1" step="0.05" />
        </div>
      </div>

    </aside>


    <main class="center">
      <div class="viewer-block">
        <div id="viewer">
          <div id="loadingOverlay">
            <div>
              <div class="loader-ring"></div>
              <div class="loader-text" id="loaderMsg">Growing…</div>
            </div>
          </div>
        </div>
      </div>
    </main>


    <aside class="info right">

      <div class="g-section" style="margin-top:0">
        <h3>Tree stats</h3>
        <div class="stat"><span>Height</span>      <strong id="stat-height">—</strong></div>
        <div class="stat"><span>Girth</span>       <strong id="stat-girth">—</strong></div>
        <div class="stat"><span>Branch depth</span><strong id="stat-depth">—</strong></div>
        <div class="stat"><span>Curtain pts</span> <strong id="stat-leaves">—</strong></div>
      </div>

      <div class="g-section">
        <h3>Season</h3>
        <div class="season-tabs">
          <button class="stab" data-s="spring">Spring</button>
          <button class="stab active" data-s="summer">Summer</button>
          <button class="stab" data-s="autumn">Autumn</button>
          <button class="stab" data-s="winter">Winter</button>
        </div>
      </div>

      <div class="g-section">
        <h3>Curtain</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Density</label><span class="val" id="v-density">1.00×</span></div>
          <input type="range" id="sl-density" min="0.1" max="3" value="1" step="0.05" />
        </div>
        <div class="gctrl">
          <div class="gctrl-head"><label>Leaf size</label><span class="val" id="v-leafsize">1.00</span></div>
          <input type="range" id="sl-leafsize" min="0.3" max="2.5" value="1" step="0.05" />
        </div>
      </div>

      <div class="g-section">
        <h3>Environment</h3>
        <div class="gctrl">
          <div class="gctrl-head"><label>Wind</label><span class="val" id="v-wind">0.35</span></div>
          <input type="range" id="sl-wind" min="0" max="1" value="0.35" step="0.02" />
        </div>
      </div>

      <button class="g-btn" id="btnRegen">↺ Regenerate tree</button>

      <div class="orbit-hint">
        drag to orbit · scroll to zoom<br>
        shift+drag to pan
      </div>

    </aside>

    <div class="stage-dots">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script type="module">
    import { generateWillow }                                     from './willowGen.js';
    import { buildThreeGeometry, buildThreeInstancedFoliage }     from './threeAdapter.js';

    // animateWind 
    function animateWind(instMesh, windTime, windStr) {
      if (!instMesh?.userData?.windPhases) return;
      const THREE  = window.THREE;
      const phases = instMesh.userData.windPhases;
      const amps   = instMesh.userData.windAmps;
      const base   = instMesh.userData.basePos;
      if (!phases || !amps || !base) return;
      const count = instMesh.count ?? instMesh.instanceMatrix.count;
      const dummy = new THREE.Object3D();
      const m4    = new THREE.Matrix4();
      for (let i = 0; i < count; i++) {
        instMesh.getMatrixAt(i, m4);
        dummy.matrixAutoUpdate = false;
        dummy.matrix.copy(m4);
        dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
        const ph  = phases[i];
        const amp = amps[i] * windStr;
        // Willow curtains 
        dummy.position.x = base[i*3]     + Math.sin(windTime * 0.8 + ph) * amp * 1.4;
        dummy.position.y = base[i*3 + 1] + Math.sin(windTime * 0.5 + ph * 1.1) * amp * 0.2;
        dummy.position.z = base[i*3 + 2] + Math.cos(windTime * 0.7 + ph * 0.8) * amp * 1.0;
        dummy.matrixAutoUpdate = true;
        dummy.updateMatrix();
        instMesh.setMatrixAt(i, dummy.matrix);
      }
      instMesh.instanceMatrix.needsUpdate = true;
    }

 
    const THREE     = window.THREE;
    const container = document.getElementById('viewer');
    const overlay   = document.getElementById('loadingOverlay');
    const loaderMsg = document.getElementById('loaderMsg');

    let speciesData = null;
    let FIXED_AGE   = 72;
    let treeGroup   = new THREE.Group();
    let foliageMesh = null;
    let windTime    = 0;
    let autoRotate  = true;

    const SEASONS = {
      spring: { leafTint: 0xc8f068, leafOpacity: 0.88, ground: 0x7aaa60, fogColor: 0xd0edd8 },
      summer: { leafTint: 0xffffff, leafOpacity: 1.00, ground: 0x6a9850, fogColor: 0xc8ddd0 },
      autumn: { leafTint: 0xffd040, leafOpacity: 0.82, ground: 0x988858, fogColor: 0xddd8b8 },
      winter: { leafTint: 0xffffff, leafOpacity: 0.00, ground: 0xa8b0a8, fogColor: 0xd0d8e0 },
    };
    let currentSeason = 'summer';

    function applySeasonEnv(s) {
      const S = SEASONS[s];
      scene.fog.color.set(S.fogColor);
      ground.material.color.set(S.ground);
    }


    //  SCENE
  
    const scene = new THREE.Scene();
    scene.fog   = new THREE.FogExp2(0xc8ddd0, 0.009);

    const camera   = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Lights 
    scene.add(new THREE.HemisphereLight(0xd0e8c8, 0x807050, 1.1));
    const sun = new THREE.DirectionalLight(0xfff8e8, 1.2);
    sun.position.set(8, 18, 9);
    sun.castShadow = true;
    Object.assign(sun.shadow.camera, { left:-28, right:28, bottom:-14, top:28, far:110 });
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0xb0d8f0, 0.40);
    fill.position.set(-6, 8, -10);
    scene.add(fill);

    // Ground 
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(90, 48),
      new THREE.MeshLambertMaterial({ color: 0x6a9850 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    scene.add(treeGroup);

    // Procedural willow bark
    function makeWillowBarkTexture() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 1024;
      const ctx = cv.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, cv.width, 0);
      g.addColorStop(0, '#4a3c28'); g.addColorStop(0.5, '#6b5a3e'); g.addColorStop(1, '#4a3c28');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);

      for (let i = 0; i < 22; i++) {
        ctx.fillStyle = `rgba(15,10,4,${0.40+Math.random()*0.45})`;
        ctx.fillRect(Math.random()*cv.width, Math.random()*cv.height, 1.2+Math.random()*2.5, 80+Math.random()*280);
      }
      for (let i = 0; i < 35; i++) {
        ctx.fillStyle = `rgba(15,10,4,${0.18+Math.random()*0.22})`;
        ctx.fillRect(Math.random()*cv.width, Math.random()*cv.height, 15+Math.random()*60, 1.5+Math.random()*2);
      }
      for (let i = 0; i < 14; i++) {
        const px = Math.random()*cv.width, py = Math.random()*cv.height, r = 20+Math.random()*45;
        const rg = ctx.createRadialGradient(px,py,0,px,py,r);
        rg.addColorStop(0, `rgba(120,100,60,${0.06+Math.random()*0.08})`);
        rg.addColorStop(1, 'rgba(120,100,60,0)');
        ctx.fillStyle = rg; ctx.fillRect(px-r,py-r,r*2,r*2);
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 5);
      return tex;
    }

    const trunkMat = new THREE.MeshStandardMaterial({ map: makeWillowBarkTexture(), color: 0xffffff, roughness: 0.93 });
    const leafTex  = new THREE.TextureLoader().load('pic/willow.png');
    const leafMat  = new THREE.MeshLambertMaterial({
      map: leafTex, color: 0x5a9048,    // natural willow green — summer baseline
      transparent: true, alphaTest: 0.15,
      side: THREE.DoubleSide, depthWrite: false,
    });


    //  ORBIT CAMERA
    
    const orbit = { theta: 0.25, phi: 1.35, r: 42, tx: 0, ty: -7 };
    let isDragging = false, lastMouse = { x:0, y:0 };

    function updateCamera() {
      const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
      camera.position.set(
        orbit.tx + orbit.r * sp * Math.sin(orbit.theta),
        orbit.ty + orbit.r * cp,
        orbit.r  * sp * Math.cos(orbit.theta)
      );
      camera.lookAt(orbit.tx, orbit.ty, 0);
    }

    const cvs = renderer.domElement;
    cvs.addEventListener('mousedown', e => {
      isDragging = true; autoRotate = false;
      lastMouse = { x: e.clientX, y: e.clientY }; e.preventDefault();
    });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
      if (e.shiftKey) { orbit.tx -= dx*0.025; orbit.ty += dy*0.025; }
      else {
        orbit.theta -= dx*0.007;
        orbit.phi = Math.max(0.10, Math.min(Math.PI*0.47, orbit.phi + dy*0.006));
      }
      lastMouse = { x: e.clientX, y: e.clientY };
      updateCamera();
    });
    cvs.addEventListener('wheel', e => {
      orbit.r = Math.max(6, Math.min(100, orbit.r + e.deltaY*0.06));
      updateCamera(); e.preventDefault();
    }, { passive: false });
    cvs.addEventListener('touchstart', e => {
      isDragging = true; autoRotate = false;
      lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    cvs.addEventListener('touchend', () => isDragging = false, { passive: true });
    cvs.addEventListener('touchmove', e => {
      if (!isDragging) return;
      orbit.theta -= (e.touches[0].clientX - lastMouse.x)*0.007;
      orbit.phi = Math.max(0.10, Math.min(Math.PI*0.47, orbit.phi + (e.touches[0].clientY-lastMouse.y)*0.006));
      lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      updateCamera();
    }, { passive: true });

    updateCamera();

    function onResize() {
      const w = container.clientWidth, h = container.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(onResize).observe(container);
    onResize();

 
    //  HELPERS

    const n   = id => Number(document.getElementById(id).value);
    const $id = id => document.getElementById(id);

    function buildSpec(base) {
      const spec = JSON.parse(JSON.stringify(base));
      spec.seed                          = n('seedInput');
      spec.trunk.heightAtMaturity_m      = n('sl-height');
      spec.trunk.girthGrowth_cm_per_year = n('sl-girth');
      spec._droopMult                    = n('sl-droop');       
      spec._crownBase                    = n('sl-crownbase');
      spec._primaryCount                 = n('sl-primary');
      spec._branchAngleOffset            = n('sl-angle');
      spec._gnarlinessMult               = n('sl-gnarly');
      spec._foliageDensity               = n('sl-density');
      return spec;
    }

    //  BUILD TREE
   
    function buildTree() {
      const age      = FIXED_AGE;
      const spec     = buildSpec(speciesData);
      const treeData = generateWillow(age, spec);
      const S        = SEASONS[currentSeason];

      // Foliage overrides 
      treeData.densityMult = n('sl-density');
      treeData.leafOpacity = S.leafOpacity;
      treeData.leafTint    = S.leafTint;

      const group = new THREE.Group();

      trunkMat.color.set(speciesData.trunk.barkColor);
      const mesh = new THREE.Mesh(buildThreeGeometry(treeData, age), trunkMat);
      mesh.castShadow = mesh.receiveShadow = true;
      group.add(mesh);

      foliageMesh = null;
      if (treeData.foliage.length > 0 && S.leafOpacity > 0.01) {
        leafMat.color.set(S.leafTint);
        leafMat.opacity  = S.leafOpacity > 0 ? S.leafOpacity : 0.001;
        leafMat.needsUpdate = true;
        const ls = n('sl-leafsize');
        const fw = 0.55 * ls, fh = 1.80 * ls;
        const fm = buildThreeInstancedFoliage(treeData, leafMat, age, age, fw, fh);
        group.add(fm);

        // Bake wind 
        const count = fm.count ?? fm.instanceMatrix.count ?? 0;
        fm.userData.windPhases = new Float32Array(count);
        fm.userData.windAmps   = new Float32Array(count);
        fm.userData.basePos    = new Float32Array(count * 3);
        let s = 4242;
        const rr = () => (s = s * 16807 % 2147483647) / 2147483647;
        const dummy = new THREE.Object3D();
        const m4    = new THREE.Matrix4();
        for (let i = 0; i < count; i++) {
          fm.getMatrixAt(i, m4);
          dummy.matrixAutoUpdate = false;
          dummy.matrix.copy(m4);
          dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
          fm.userData.windPhases[i]      = rr() * Math.PI * 2;
          fm.userData.windAmps[i]        = 0.18 + rr() * 0.28;   // willow curtains sway broadly
          fm.userData.basePos[i*3]       = dummy.position.x;
          fm.userData.basePos[i*3 + 1]   = dummy.position.y;
          fm.userData.basePos[i*3 + 2]   = dummy.position.z;
        }
        fm.count   = count;
        foliageMesh = fm;
      }

      // Willow scale 
      group.scale.setScalar(0.44);
      group.position.y = -11;

      // Camera tracks 
      const gf  = Math.min(age / speciesData.age.max, 1);
      const h   = spec.trunk.heightAtMaturity_m * Math.pow(gf, 0.68);
      orbit.ty  = -11 + h * 0.44 * 0.35;
      updateCamera();

      // Stats
      const circ = (spec.trunk.girthGrowth_cm_per_year * age / 100).toFixed(2);
      const maxD = age<3?0 : age<8?1 : age<20?2 : age<50?3 : 4;
      $id('stat-height').textContent  = `${h.toFixed(1)} m`;
      $id('stat-girth').textContent   = `${circ} m`;
      $id('stat-depth').textContent   = `level ${maxD}`;
      $id('stat-leaves').textContent  = treeData.foliage.length.toLocaleString();

      return group;
    }

    //  UPDATE

    let pending = false;

    function updateTree() {
      if (!speciesData || pending) return;
      pending = true;
      overlay.classList.remove('hidden');
      loaderMsg.textContent = 'Growing…';

      requestAnimationFrame(() => requestAnimationFrame(() => {
        try {
          scene.remove(treeGroup);
          treeGroup.traverse(c => { if (c.geometry) c.geometry.dispose(); });
          treeGroup = buildTree();
          scene.add(treeGroup);
        } catch (err) {
          console.error('[willow.html] buildTree error:', err);
          loaderMsg.textContent = 'Error: ' + err.message;
          pending = false;
          return;
        }
        overlay.classList.add('hidden');
        pending = false;
      }));
    }

    window.addEventListener('resize', onResize);

    //  CONTROL WIRING

    const CTRLS = [
      { id: 'sl-height',    vid: 'v-height',    fmt: v => `${parseFloat(v).toFixed(1)} m`, live: false },
      { id: 'sl-girth',     vid: 'v-girth',     fmt: v => parseFloat(v).toFixed(1),         live: false },
      { id: 'sl-droop',     vid: 'v-droop',     fmt: v => `${parseFloat(v).toFixed(2)}×`,   live: false },
      { id: 'sl-crownbase', vid: 'v-crownbase', fmt: v => parseFloat(v).toFixed(2),          live: false },
      { id: 'sl-primary',   vid: 'v-primary',   fmt: v => v,                                live: false },
      { id: 'sl-angle',     vid: 'v-angle',     fmt: v => `${v}°`,                          live: false },
      { id: 'sl-gnarly',    vid: 'v-gnarly',    fmt: v => `${parseFloat(v).toFixed(2)}×`,   live: false },
      { id: 'sl-density',   vid: 'v-density',   fmt: v => `${parseFloat(v).toFixed(2)}×`,   live: false },
      { id: 'sl-leafsize',  vid: 'v-leafsize',  fmt: v => parseFloat(v).toFixed(2),          live: false },
      { id: 'sl-wind',      vid: 'v-wind',      fmt: v => parseFloat(v).toFixed(2),          live: true  },
    ];

    CTRLS.forEach(({ id, vid, fmt, live }) => {
      const el = $id(id), out = $id(vid);
      if (!el || !out) return;
      out.textContent = fmt(el.value);
      el.addEventListener('input', () => {
        out.textContent = fmt(el.value);
        if (!live && speciesData) updateTree();
      });
    });

    // Seasons
    document.querySelectorAll('.stab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.stab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSeason = btn.dataset.s;
        applySeasonEnv(currentSeason);
        if (speciesData) updateTree();
      });
    });

    $id('btnRandom').addEventListener('click', () => {
      $id('seedInput').value = Math.floor(Math.random() * 999998) + 1;
      if (speciesData) updateTree();
    });
    $id('seedInput').addEventListener('change', () => { if (speciesData) updateTree(); });
    $id('btnRegen').addEventListener('click',   () => { if (speciesData) updateTree(); });


    //  RENDER LOOP

    let lastTs = 0;
    (function animate(ts) {
      requestAnimationFrame(animate);
      const dt  = Math.min((ts - lastTs) / 1000, 0.05);
      lastTs    = ts;
      windTime += dt;

      if (autoRotate) { orbit.theta += dt * 0.14; updateCamera(); }

      if (foliageMesh) {
        const ws = n('sl-wind');
        if (ws > 0.01) animateWind(foliageMesh, windTime, ws);
      }

      renderer.render(scene, camera);
    })(0);

   
    //  LOAD willow.json
  
    fetch('./willow.json')
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => {
        speciesData = data;

        FIXED_AGE = Math.round(data.age.max * 0.82); 

        $id('tree-name').textContent      = data.commonName;
        $id('tree-species').textContent   = data.species;
        $id('tree-environment').innerHTML = 'Riverbanks &amp; wetlands<br>China, cultivated worldwide';
        $id('tree-description').textContent =
          'The Weeping Willow is one of the most recognisable trees in the world, ' +
          'known for its long cascading branches that sweep gracefully toward the ground. ' +
          'It thrives near water and grows rapidly — its narrow leaves shimmer in the slightest breeze.';

        // Sync sliders from json
        $id('sl-height').value  = data.trunk.heightAtMaturity_m;
        $id('sl-girth').value   = data.trunk.girthGrowth_cm_per_year;
        $id('sl-primary').value = data.branching.primaryBranchCount;
        $id('v-height').textContent  = `${parseFloat(data.trunk.heightAtMaturity_m).toFixed(1)} m`;
        $id('v-girth').textContent   = parseFloat(data.trunk.girthGrowth_cm_per_year).toFixed(1);
        $id('v-primary').textContent = data.branching.primaryBranchCount;

        applySeasonEnv(currentSeason);
        updateTree();
      })
      .catch(err => {
        console.error('[willow.html] Failed to load willow.json:', err);
        loaderMsg.textContent = 'Failed to load willow.json';
      });
  </script>

</body>
</html>
